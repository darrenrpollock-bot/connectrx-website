  <script>
    var ADMIN_PASSWORD = "connectrx2026";
    var SESSION_KEY = "crx_admin_auth";
    var _authCleared = sessionStorage.getItem(SESSION_KEY) === "1";

    window.addEventListener('DOMContentLoaded', function() {
      if (_authCleared) return;
      var overlay = document.getElementById('crx-auth-overlay');
      if (overlay) overlay.style.display = 'flex';
      document.getElementById('root').style.display = 'none';
      document.getElementById('crx-auth-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') checkAuth();
      });
      setTimeout(function() {
        document.getElementById('crx-auth-input').focus();
      }, 100);
    });

    function checkAuth() {
      var val = document.getElementById('crx-auth-input').value;
      var err = document.getElementById('crx-auth-error');
      if (val === ADMIN_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, "1");
        document.getElementById('crx-auth-overlay').style.display = 'none';
        document.getElementById('root').style.display = '';
      } else {
        err.style.display = 'block';
        err.textContent = 'Incorrect password. Try again.';
        document.getElementById('crx-auth-input').value = '';
        document.getElementById('crx-auth-input').focus();
      }

      return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
    }

    function downloadFile(filename, content) {
      const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    }

    function downloadJS(filename, content) {
      const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });

        if (b.type === 'list') {

    function generateUpdatedDataJS(newEntry) {
      const allArticles = [...(window.ARTICLES_DATA || []), newEntry];
      const json = JSON.stringify(allArticles, null, 2);
      return `// ─────────────────────────────────────────────────────────────
//  ConnectRx Articles Data
//  To add a new article:
//    1. Use admin.html to generate the article HTML file
//    2. Upload the generated file to the project
//    3. Add a new entry to this array (admin.html does this for you)
// ─────────────────────────────────────────────────────────────

window.ARTICLES_DATA = ${json};\n`;
    }

    // ── Main App ─────────────────────────────────────────────────────
    function App() {
      const [form, setForm] = useState(emptyForm());
      const [tab, setTab] = useState('edit'); // 'edit' | 'preview' | 'export'
      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState('');
      const [exported, setExported] = useState(false);

      const update = (key, val) => setForm(f => ({ ...f, [key]: val }));

      // Blocks
      const addBlock = (type = 'paragraph') => {
        setForm(f => ({ ...f, blocks: [...f.blocks, { id: Date.now(), type, content: '' }] }));
      };
      const updateBlock = (id, key, val) => {
        setForm(f => ({ ...f, blocks: f.blocks.map(b => b.id === id ? { ...b, [key]: val } : b) }));
      };
      const removeBlock = (id) => {
        setForm(f => ({ ...f, blocks: f.blocks.filter(b => b.id !== id) }));
      };
      const moveBlock = (id, dir) => {
        setForm(f => {
          const arr = [...f.blocks];
          const i = arr.findIndex(b => b.id === id);
          const j = i + dir;
          if (j < 0 || j >= arr.length) return f;
          [arr[i], arr[j]] = [arr[j], arr[i]];
          return { ...f, blocks: arr };
        });
      };

      // AI Assist
      const aiAssist = async () => {
        if (!form.title) { setAiError('Please enter a title first.'); return; }
        setAiLoading(true);
        setAiError('');
        try {
          const prompt = `You are a B2B content writer for ConnectRx, an Australian medical device sales intelligence platform.

Write a sharp, insightful article for complex sales professionals (medical device / pharma reps and managers).

Title: "${form.title}"
Category: ${form.category}
${form.excerpt ? `Excerpt/angle: ${form.excerpt}` : ''}

Write 4–6 body sections. Return ONLY a JSON array of blocks, no other text.
Each block: { "type": "paragraph"|"heading"|"pullquote"|"list", "content": "..." }
For list blocks, put each bullet on a new line in content.
Heading blocks should be section titles (no numbers).
Include 1 pullquote and 1 list block.
Keep it Australian English. Authoritative, not salesy. About 800–1000 words total.`;

          throw new Error('AI draft is not available in this version. Please write manually.');
        } catch (e) {
          setAiError(e.message || 'AI draft unavailable. Please write manually.');
        }
        setAiLoading(false);
      };

      // Export
      const handleDownloadArticle = () => {
        const slug = slugify(form.title) || 'new-article';
        const filename = `article-${slug}.html`;
        downloadFile(filename, generateArticleHTML(form));
        setExported(true);
      };

      const handleDownloadData = () => {
        const slug = slugify(form.title) || 'new-article';
        const entry = {
          id: slug,
          file: `article-${slug}.html`,
          tag: form.tag || (CATEGORIES.find(c => c.value === form.category) || {}).label || '',
          category: form.category,
          title: form.title,
          excerpt: form.excerpt,
          readTime: form.readTime,
          date: form.date,
          patternType: form.patternType,
        };
        downloadJS('articles-data.js', generateUpdatedDataJS(entry));
      };

      const articles = window.ARTICLES_DATA || [];

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', background: 'var(--cream-mid)' }}>

          {/* Top bar */}
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '0 24px', height: 56,
            background: 'var(--ink)', flexShrink: 0,
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <img src="uploads/GekoBrown.png" style={{ width: 28, height: 28, objectFit: 'contain', mixBlendMode: 'screen', opacity: 0.85 }} alt="" />
              <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 15, color: 'rgba(250,248,244,0.9)', letterSpacing: '-0.02em' }}>ConnectRx</span>
              <span style={{ color: 'rgba(250,248,244,0.3)', margin: '0 4px' }}>/</span>
              <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 600, fontSize: 14, color: 'rgba(250,248,244,0.6)' }}>Article Manager</span>
            </div>
            <a href="articles.html" style={{ fontSize: 13, color: 'rgba(250,248,244,0.5)', fontWeight: 500, textDecoration: 'none', display: 'flex', alignItems: 'center', gap: 6 }}>
              <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M11 7H3M7 3l-4 4 4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              View Articles
            </a>
          </div>

          {/* Body */}
          <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>

            {/* Sidebar */}
            <div style={{
              width: 260, flexShrink: 0, background: 'var(--cream)',
              borderRight: '1px solid var(--border)', display: 'flex', flexDirection: 'column',
              overflow: 'hidden',
            }}>
              <div style={{ padding: '20px 16px 12px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--ink-light)', fontFamily: 'var(--font-ui)', marginBottom: 2 }}>Published Articles</div>
                <div style={{ fontSize: 12, color: 'var(--ink-light)', marginTop: 4 }}>{articles.length} article{articles.length !== 1 ? 's' : ''}</div>
              </div>
              <div style={{ overflowY: 'auto', flex: 1, padding: '8px 0' }}>
                {articles.map(a => (
                  <div key={a.id} style={{ padding: '10px 16px', borderBottom: '1px solid var(--border)' }}>
                    <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--green)', fontFamily: 'var(--font-ui)', marginBottom: 4 }}>{a.tag}</div>
                    <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--ink)', lineHeight: 1.35, marginBottom: 6 }}>{a.title}</div>
                    <div style={{ fontSize: 11.5, color: 'var(--ink-light)' }}>{a.date} · {a.readTime}</div>
                  </div>
                ))}
              </div>
              <div style={{ padding: 12, borderTop: '1px solid var(--border)', flexShrink: 0 }}>
                <button
                  onClick={() => { setForm(emptyForm()); setTab('edit'); setExported(false); }}
                  style={{
                    width: '100%', padding: '9px 0', borderRadius: 8,
                    background: 'var(--green)', color: '#fff', border: 'none',
                    fontSize: 13, fontWeight: 600,
                  }}
                >+ New Article</button>
              </div>
            </div>

            {/* Main area */}
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

              {/* Tab bar */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 0, padding: '0 24px', borderBottom: '1px solid var(--border)', background: 'var(--cream)', flexShrink: 0, height: 44 }}>
                {[['edit','Edit'],['preview','Preview'],['export','Export & Download']].map(([key,label]) => (
                  <button key={key} onClick={() => setTab(key)} style={{
                    padding: '0 16px', height: 44, border: 'none', background: 'none',
                    fontSize: 13, fontWeight: 600, cursor: 'pointer',
                    color: tab === key ? 'var(--ink)' : 'var(--ink-light)',
                    borderBottom: tab === key ? '2px solid var(--green)' : '2px solid transparent',
                    transition: 'all 0.18s',
                  }}>{label}</button>
                ))}
              </div>

              {/* Edit tab */}
              {tab === 'edit' && (
                <div style={{ flex: 1, overflowY: 'auto', padding: 24 }}>
                  <div style={{ maxWidth: 680, margin: '0 auto' }}>

                    {/* AI Assist */}
                    <div style={{
                      background: 'linear-gradient(135deg, #F0EBE0, #E8E0F0)',
                      border: '1px solid rgba(139,107,69,0.2)',
                      borderRadius: 12, padding: '16px 20px', marginBottom: 24,
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16,
                    }}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink)', marginBottom: 3 }}>AI Writing Assistant</div>
                        <div style={{ fontSize: 12, color: 'var(--ink-light)', lineHeight: 1.5 }}>Enter a title (and optional excerpt), then let AI draft the full article body for you.</div>
                        {aiError && <div style={{ fontSize: 12, color: '#c0392b', marginTop: 6 }}>{aiError}</div>}
                      </div>
                      <button onClick={aiAssist} disabled={aiLoading} style={{
                        padding: '9px 20px', borderRadius: 8, border: 'none', whiteSpace: 'nowrap',
                        background: aiLoading ? 'var(--cream-dark)' : 'var(--ink)',
                        color: aiLoading ? 'var(--ink-light)' : '#fff',
                        fontSize: 13, fontWeight: 600, flexShrink: 0,
                      }}>
                        {aiLoading ? 'Writing…' : '✦ Draft with AI'}
                      </button>
                    </div>

                    {/* Meta fields */}
                    <div style={{ background: 'var(--cream)', borderRadius: 12, padding: 20, marginBottom: 16, border: '1px solid var(--border)' }}>
                      <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--ink-light)', fontFamily: 'var(--font-ui)', marginBottom: 16 }}>Article Details</div>
                      <div className="field">
                        <label>Title</label>
                        <input value={form.title} onChange={e => update('title', e.target.value)} placeholder="e.g. Why the Old Way of Territory Planning Is Holding You Back" />
                      </div>
                      <div className="field-row">
                        <div>
                          <label>Category</label>
                          <select value={form.category} onChange={e => update('category', e.target.value)}>
                            {CATEGORIES.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
                          </select>
                        </div>
                        <div>
                          <label>Tag (displayed on card)</label>
                          <input value={form.tag} onChange={e => update('tag', e.target.value)} placeholder="e.g. Sales Strategy" />
                        </div>
                      </div>
                      <div className="field-row">
                        <div>
                          <label>Date</label>
                          <input value={form.date} onChange={e => update('date', e.target.value)} placeholder="e.g. May 2026" />
                        </div>
                        <div>
                          <label>Read Time</label>
                          <input value={form.readTime} onChange={e => update('readTime', e.target.value)} placeholder="e.g. 8 min read" />
                        </div>
                      </div>
                      <div className="field">
                        <label>Excerpt (shown on article listing page)</label>
                        <textarea rows={3} value={form.excerpt} onChange={e => update('excerpt', e.target.value)} placeholder="1–2 sentence hook that appears on the articles listing card…" />
                      </div>
                      <div className="field" style={{ marginBottom: 0 }}>
                        <label>Card Illustration Pattern</label>
                        <select value={form.patternType} onChange={e => update('patternType', e.target.value)}>
                          {PATTERNS.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
                        </select>
                      </div>
                    </div>

                    {/* Body blocks */}
                    <div style={{ background: 'var(--cream)', borderRadius: 12, padding: 20, marginBottom: 16, border: '1px solid var(--border)' }}>
                      <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--ink-light)', fontFamily: 'var(--font-ui)', marginBottom: 16 }}>Article Body</div>

                      {form.blocks.map((block, idx) => (
                        <div key={block.id} style={{
                          border: '1px solid var(--border)', borderRadius: 10,
                          padding: 14, marginBottom: 12, background: 'var(--cream-mid)',
                        }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                            <select value={block.type} onChange={e => updateBlock(block.id, 'type', e.target.value)} style={{ width: 'auto', padding: '5px 10px', fontSize: 12, flex: 1 }}>
                              {BLOCK_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                            </select>
                            <button onClick={() => moveBlock(block.id, -1)} disabled={idx === 0} style={{ padding: '4px 8px', border: '1px solid var(--border)', borderRadius: 6, background: 'var(--cream)', fontSize: 12, color: 'var(--ink-mid)' }}>↑</button>
                            <button onClick={() => moveBlock(block.id, 1)} disabled={idx === form.blocks.length - 1} style={{ padding: '4px 8px', border: '1px solid var(--border)', borderRadius: 6, background: 'var(--cream)', fontSize: 12, color: 'var(--ink-mid)' }}>↓</button>
                            <button onClick={() => removeBlock(block.id)} style={{ padding: '4px 8px', border: '1px solid rgba(200,80,60,0.3)', borderRadius: 6, background: 'rgba(200,80,60,0.06)', fontSize: 12, color: '#c0392b' }}>✕</button>
                          </div>
                          <textarea
                            rows={block.type === 'paragraph' ? 4 : block.type === 'list' ? 5 : 2}
                            value={block.content}
                            onChange={e => updateBlock(block.id, 'content', e.target.value)}
                            placeholder={
                              block.type === 'paragraph' ? 'Write your paragraph here…' :
                              block.type === 'heading' ? 'Section heading…' :
                              block.type === 'pullquote' ? 'A compelling quote from the article…' :
                              'One bullet point per line…'
                            }
                            style={{ marginBottom: 0 }}
                          />
                        </div>
                      ))}

                      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 4 }}>
                        {BLOCK_TYPES.map(t => (
                          <button key={t.value} onClick={() => addBlock(t.value)} style={{
                            padding: '6px 14px', border: '1.5px dashed var(--border-strong)',
                            borderRadius: 8, background: 'transparent', fontSize: 12,
                            color: 'var(--ink-mid)', fontWeight: 500,
                          }}>+ {t.label}</button>
                        ))}
                      </div>
                    </div>

                    {/* CTA */}
                    <div style={{ background: 'var(--cream)', borderRadius: 12, padding: 20, border: '1px solid var(--border)' }}>
                      <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--ink-light)', fontFamily: 'var(--font-ui)', marginBottom: 16 }}>End-of-Article CTA</div>
                      <div className="field">
                        <label>CTA Heading</label>
                        <input value={form.ctaHeading} onChange={e => update('ctaHeading', e.target.value)} />
                      </div>
                      <div className="field" style={{ marginBottom: 0 }}>
                        <label>CTA Subtext</label>
                        <input value={form.ctaBody} onChange={e => update('ctaBody', e.target.value)} />
                      </div>
                    </div>

                  </div>
                </div>
              )}

              {/* Preview tab */}
              {tab === 'preview' && (
                <div style={{ flex: 1, overflow: 'hidden', background: '#fff' }}>
                  <iframe
                    srcDoc={generateArticleHTML(form)}
                    style={{ width: '100%', height: '100%', border: 'none' }}
                    title="Article preview"
                  />
                </div>
              )}

              {/* Export tab */}
              {tab === 'export' && (
                <div style={{ flex: 1, overflowY: 'auto', padding: 24 }}>
                  <div style={{ maxWidth: 600, margin: '0 auto' }}>

                    <div style={{ fontFamily: 'var(--font-head)', fontSize: 28, fontWeight: 400, color: 'var(--ink)', marginBottom: 8 }}>Publish Your Article</div>
                    <div style={{ fontSize: 14, color: 'var(--ink-light)', marginBottom: 32, lineHeight: 1.7 }}>Two steps to make your new article live on the site. Download both files, then upload them to your project.</div>

                    {/* Step 1 */}
                    <div style={{ background: 'var(--cream)', border: '1px solid var(--border)', borderRadius: 12, padding: 24, marginBottom: 16 }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 16 }}>
                        <div style={{ width: 32, height: 32, borderRadius: '50%', background: 'var(--ink)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700, flexShrink: 0, fontFamily: 'var(--font-ui)' }}>1</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink)', marginBottom: 6 }}>Download Article HTML</div>
                          <div style={{ fontSize: 13, color: 'var(--ink-light)', lineHeight: 1.6, marginBottom: 16 }}>
                            Downloads <code style={{ background: 'var(--cream-mid)', padding: '1px 6px', borderRadius: 4, fontSize: 12 }}>article-{slugify(form.title) || 'new-article'}.html</code> — the complete article page. Upload this file to your project.
                          </div>
                          <button onClick={handleDownloadArticle} style={{
                            padding: '10px 22px', borderRadius: 8, border: 'none',
                            background: 'var(--ink)', color: '#fff', fontSize: 13, fontWeight: 600,
                          }}>
                            ↓ Download Article File
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Step 2 */}
                    <div style={{ background: 'var(--cream)', border: '1px solid var(--border)', borderRadius: 12, padding: 24, marginBottom: 24 }}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 16 }}>
                        <div style={{ width: 32, height: 32, borderRadius: '50%', background: 'var(--ink)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700, flexShrink: 0, fontFamily: 'var(--font-ui)' }}>2</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink)', marginBottom: 6 }}>Download Updated Article Listing</div>
                          <div style={{ fontSize: 13, color: 'var(--ink-light)', lineHeight: 1.6, marginBottom: 16 }}>
                            Downloads an updated <code style={{ background: 'var(--cream-mid)', padding: '1px 6px', borderRadius: 4, fontSize: 12 }}>articles-data.js</code> with your new article added. Replace the existing file in your project — this makes the article appear on the listing page automatically.
                          </div>
                          <button onClick={handleDownloadData} style={{
                            padding: '10px 22px', borderRadius: 8, border: 'none',
                            background: 'var(--green)', color: '#fff', fontSize: 13, fontWeight: 600,
                          }}>
                            ↓ Download Updated articles-data.js
                          </button>
                        </div>
                      </div>
                    </div>

                    <div style={{ background: 'rgba(139,107,69,0.07)', border: '1px solid rgba(139,107,69,0.18)', borderRadius: 10, padding: '14px 18px', fontSize: 13, color: 'var(--ink-mid)', lineHeight: 1.6 }}>
                      <strong>Tip:</strong> After uploading both files, refresh <a href="articles.html" style={{ color: 'var(--green)', fontWeight: 600 }}>articles.html</a> and your new article will appear at the top of the listing.
                    </div>

                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
